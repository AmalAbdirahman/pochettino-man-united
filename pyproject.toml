[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pochettino_fit"
version = "0.1.0"
description = "Pochettino at United: style fit, pre-registered forecast and public tracker (statistical model)."
readme = "docs/methods.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "statsmodels>=0.14.5",  # 0.14.4 fails to import with scipy 1.18
    "pymc",
    "numba",
    "arviz",
    "matplotlib",
    "soccerdata",
    "pyarrow",
    "pyyaml",
    "tabulate",
    "h5netcdf",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not slow'"
markers = ["slow: long sampling runs (run with -m slow)"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["scripts/exploratory"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
