# Settings for the Pochettino at United model. Method: docs/methods.md (version 2).
# Only values known at setup are here; later steps add their own sections.

model_version: 2

appointment:
  manager: Mauricio Pochettino
  club: Manchester United
  announced: 2026-11-13
  starts: 2026-11-18
  contract_until: 2029-06-30
  outgoing_manager: Michael Carrick
  season: 2026-27

scope:
  leagues: [ENG-Premier League, ESP-La Liga, GER-Bundesliga, ITA-Serie A, FRA-Ligue 1]
  first_season: 2014-15
  league_matches_only: true

outcome:
  metric: npxg_diff_per90           # home npxG minus away npxG, per 90
  truncate_at_first_red: true
  rows_per_match: 1                 # home team's view, never mirrored rows

luck:
  window_matches: 10                # goals minus npxG over previous league matches

manager_drift:
  block: half_season                # fallback: season
  fallback_block: season

international:
  friendly_weight: 0.5
  competitive_weight: 1.0
  lambda_prior_mean: 0.5
  lambda_prior_sd: 0.5

finishing:
  shot_noise_factor: 0.85           # Var(G - X) ~ 0.85 * X
  phi_prior_sd: 0.05
  squad_file: data/united_squad_2026_27.csv
  share_season: 2025-26             # npxG shares from each player's npxG per club league match in this season
  interval: 0.90

detectability:
  alpha_z: 1.96
  power_z: 0.84

# Downloads (prompt 1). Terms checked 2026-11-13; see docs/data_sources.md.
# Raw files stay in data/raw/ (git-ignored); only derived figures are published.
sources:
  understat_archive:          # frozen 2026-04-18; Understat offline since ~2026-11-02
    base: https://github.com/peteowen1/pannadata/releases/download/understat-latest
    files: [understat_shots.parquet, understat_metadata.parquet, understat-manifest.parquet]
  transfermarkt:              # transfermarkt-datasets (CC0 by author), frozen 2026-07-06
    base: https://pub-e682421888d945d684bcae8890b0ec20.r2.dev/data
    files: [games.csv.gz, club_games.csv.gz, game_events.csv.gz, game_lineups.csv.gz,
            player_valuations.csv.gz, clubs.csv.gz, competitions.csv.gz]
  football_data:              # football-data.co.uk results; HxG/AxG only from 2026-27 (provider unstated)
    base: https://football-data.co.uk/mmz4281
    leagues: {ENG: E0, ESP: SP1, GER: D1, ITA: I1, FRA: F1}
  clubelo:                    # league-average Elo only; one snapshot per season start
    base: http://api.clubelo.com
    snapshot_day: "08-01"

leagues:                      # canonical code -> code in each source
  ENG: {transfermarkt: GB1, clubelo: ENG}
  ESP: {transfermarkt: ES1, clubelo: ESP}
  GER: {transfermarkt: L1, clubelo: GER}
  ITA: {transfermarkt: IT1, clubelo: ITA}
  FRA: {transfermarkt: FR1, clubelo: FRA}

features:
  data_cutoff: 2026-11-13
  min_minutes_11v11: 10         # drop matches with a red card earlier than this
  squad_value_date: "08-01"     # pre-season valuation date
  squad_value_window_days: 365  # only valuations this recent count
  squad_value_min_players: 15   # fewer valued players -> squad value missing (promoted clubs)
  tenure_cap_years: 3           # tenure year 1, 2, 3+
  name_match_min_votes: 3
  name_match_min_share: 0.8

# Synthetic recovery test (prompt 2). Truth values are for simulation only.
simulation:
  sizes:
    tiny:  {leagues: 1, seasons: 2, clubs: 10, pool_clubs: 12}
    small: {leagues: 2, seasons: 4, clubs: 20, pool_clubs: 24}
    full:  {leagues: 5, seasons: 12, clubs: 20, pool_clubs: 26}
  truth:
    sigma: 1.2              # match noise sd at w = 1
    h0: 0.30                # mean home advantage (npxG diff per 90)
    sigma_h: 0.08
    no_crowd_season: 6      # season index with home advantage near zero
    no_crowd_h: 0.05
    sigma_kappa: 0.20       # club effect sd
    b_value: 0.25           # effect of log squad value
    alpha: 0.5              # league offset per standardised league Elo (cancels in y)
    sigma_lambda: 0.05
    sigma_mu: 0.15          # long-run manager level sd
    tau: 0.12               # stationary sd of the manager deviation
    gamma: 0.7              # OU decay per year (half-life ln2/gamma ~ 1 year)
    delta: [0.08, 0.03]     # tenure year 1, year 2 (3+ = 0)
    beta: -0.10             # recent luck coefficient
    lambda_int: 0.6
    sigma_int: 0.45
    red_card_prob: 0.10
    sack_prob: 0.7          # bottom-3 clubs at each half-season sack with this probability
    leave_prob: 0.20        # any manager leaves at season end
    rehire_prob: 0.5        # vacancy filled from unemployed managers (any league)
    n_international: 15
    intl_matches_per_block: 5
  sampling: {draws: 1000, tune: 1000, chains: 4, cores: 4, target_accept: 0.9, mode: NUMBA}

# Real-data fit (prompt 3)
fit:
  manager: Mauricio Pochettino
  outgoing: Michael Carrick
  club_tm_name: Manchester United
  now: 2026-11-18                 # date at which "current" effects are evaluated
  spells:                         # leave-one-out refits: Pochettino's league spells by TM club name
    spurs: Tottenham Hotspur
    psg: Paris Saint-Germain
    chelsea: Chelsea FC
  sampling: {draws: 1000, tune: 1500, chains: 4, cores: 4, target_accept: 0.95, mode: NUMBA}

# United profile (prompt 4)
profile:
  team_tm_id: 985
  understat_season: 2025-26         # archive frozen 2026-04-18
  understat_league: ENG
  fotmob_season: 2026-27            # local-only FotMob notes, never published
  reference_date: 2026-11-13        # recency weights are measured from here
  half_life_days: 180
  bootstrap: 2000
  seed: 20261118
  interval: 0.90

# Frozen forecast (prompt 6)
forecast:
  league: ENG
  season: 2026-27
  first_league_match: 2026-11-22     # Liverpool (away); the forecast must be frozen before this date
  window_start: 2025-07-01           # attack/defence fit uses league matches from here, recency-weighted
  half_life_days: 180
  rate_season: 2025-26               # season used for the penalty goal rate
  posterior: fit_base.nc
  draws: 4000                        # = all posterior draws of the manager model
  seed: 20261122
  interval_levels: [0.5, 0.8]
  fixture_draws_kept: 1000            # per-fixture United points draws stored for the tracker
  shock: false                       # chosen by the back-test (best mean log score, all leagues)
  calibrate: false
  model_choice: >-
    Back-test (docs/data/backtest.json, 482 appointments): the xG simulation without the match-level
    shock and without goal calibration had the best mean log score; the shock did not help, so it is off
    (methods 8.3: keep a component only if it helps).
  squad_freeze_note: >-
    Squad frozen at 2026-11-13 (data/united_squad_2026_27.csv). January transfers, injuries and
    suspensions are not modelled. Other clubs keep their current strength and manager all season.
  deviations:
    - "5a: manager effects are not fitted inside the log-link model. The attack/defence model is fitted
       without manager terms; United's manager terms come from the prompt-3 npxG-difference posterior and
       are split half to attack and half to defence on the log scale (united_effects.split_effect)."
    - "5b: United's fitted strength spans Amorim, an interim coach and Carrick, so the stripped term is the
       recency-weighted average of their (effect + tenure) over the same matches, not Carrick's alone."
    - "Recent-luck term (beta) not used in the forecast; its posterior mean is about 0.016 per goal."
    - "2026-27 npxG for clubs other than United: football-data xG minus the 2025-26 penalty goal rate per
       team-match (penalties per match are not in that source)."
    - "Dixon-Coles low-score correction not used."
    - "5c: the match-level xG shock is switched off because the back-test did not support it."

# Back-test of the forecast machinery (prompt 6)
backtest:
  seasons: [2015-16, 2016-17, 2017-18, 2018-19, 2019-20, 2020-21, 2021-22, 2022-23, 2023-24, 2024-25]
  min_before: 6
  min_after: 8
  window_days: 450
  half_life_days: 180
  draws: 2000
  seed: 20261115

# Style fit (prompt 5)
style:
  reference_league_season: ENG 2025-26   # natural-unit levels are shown for this league-season
  distance_metrics: [shots_for, shots_against, npxg_per_shot_for, npxg_per_shot_against,
                     setpiece_share_for, ppda, deep_for, deep_against]
  weakness: [npxg_per_shot_against, setpiece_npxg_against, npxg_against]
  min_matches_percentile: 76             # managers in the |effect| percentile need this many matches
  interval: 0.8
  seed: 20261121
  sampling: {draws: 1000, tune: 1000, chains: 4, cores: 4, target_accept: 0.9, mode: NUMBA}
  limits:
    - "Understat team-match data only (archive ends 2026-04-18): no possession, field tilt or big chances,
       and none of Carrick's 2026-27 matches."
    - "Manager style effects are static (no drift, no tenure term), unlike the outcome model."
    - "Style fit predicting results is a hypothesis that has not been back-tested: description only."

# Tracker (prompt 7)
tracker:
  publish_fotmob_values: false     # true would put FotMob-derived npxG and chance quality in docs/data

paths:
  raw: data/raw
  processed: data/processed
  docs_data: docs/data
  forecasts: docs/forecasts
